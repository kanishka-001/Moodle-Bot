[project]
name = "moodle-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kanishka Madhuranga", email = "kanishkamaduranga03@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.7.2",
    "jsonpatch>=1.33",
    "neonize>=0.4.3.post0",
    "openai>=2.53.0",
    "peewee>=4.3.0",
    "pillow>=12.3.0",
    "pip>=26.2.1",
    "requests>=2.34.2",
    "segno>=1.6.6",
    "streamlit>=1.62.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
moodle-bot = "moodle_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-dirs = ["src"]
